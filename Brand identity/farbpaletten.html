<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Northframe – Farbrichtungen</title><style>*{box-sizing:border-box}body{margin:0;background:#eeedf0;color:#191a24;font:16px/1.6 system-ui;padding:5vw}h1{font-size:clamp(30px,5vw,64px);letter-spacing:-.06em;margin:0}header p{max-width:700px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}article{background:var(--paper);border-radius:16px;overflow:hidden;border:1px solid #0002}.sample{padding:30px;color:var(--ink)}.logo{width:115px;height:90px;object-fit:contain;mix-blend-mode:multiply}h2{font-size:25px;line-height:1.2;letter-spacing:-.04em}label{display:block;font-size:13px;margin-top:24px}input{width:100%;padding:14px;border:1px solid #767681;border-radius:6px;background:white;font:inherit;color:var(--ink)}input:focus-visible,button:focus-visible{outline:3px solid var(--action);outline-offset:4px}button{margin-top:20px;background:var(--action);color:white;border:0;border-radius:6px;padding:15px 18px;font:600 14px system-ui;width:100%;cursor:pointer}.accent{display:inline-block;background:var(--accent);padding:4px 10px;font-size:12px;border-radius:20px}.swatches{display:flex;height:85px}.swatches span{flex:1;display:grid;place-items:center;font:11px monospace}.note{padding:20px;font-size:13px;background:white;margin:0}@media(max-width:950px){main{grid-template-columns:1fr}.sample{padding:25px}}</style><header><p>NORTHFRAME / BRAND EXPLORATION</p><h1>Kreativ. Verlässlich. Sorgfältig.</h1><p>Drei Farbentwürfe im gleichen Formularlayout. Noch keine festgelegten Markenfarben. Das Formular ist eine reine Vorschau.</p></header><main id="palettes"></main><script>
const palettes=[{name:'01 · Kobalt & Apricot',desc:'Meine Empfehlung: klare digitale Präsenz mit einem warmen, kreativen Akzent.',ink:'#17233D',action:'#3454D1',accent:'#FFC6A8',paper:'#F7F8FC'},{name:'02 · Indigo & Flieder',desc:'Künstlerischer und ruhiger: ein Designstudio mit elegantem Charakter.',ink:'#24213B',action:'#5B43C4',accent:'#D9CCFF',paper:'#F8F6FC'},{name:'03 · Graphit & Koralle',desc:'Ausdrucksstark und nahbar: warme Akzente auf einer sachlichen Grundlage.',ink:'#242831',action:'#B83F32',accent:'#FFB8A9',paper:'#FAF7F3'}];
const lum=h=>{const c=h.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return c[0]*.2126+c[1]*.7152+c[2]*.0722};
for(const p of palettes){const contrast=(1.05/(lum(p.action)+.05)).toFixed(2);const a=document.createElement('article');a.style.cssText=`--ink:${p.ink};--action:${p.action};--accent:${p.accent};--paper:${p.paper}`;a.innerHTML=`<div class="sample"><img class="logo" src="northframe-nf-black-transparent.png" alt="Northframe"><p><span class="accent">Let's create something.</span></p><h2>${p.name}</h2><p>${p.desc}</p><label>Dein Name<input placeholder="Alex Morgan" autocomplete="off"></label><button type="button">Projekt besprechen ↗</button></div><div class="swatches">${[p.ink,p.action,p.accent,p.paper].map((c,i)=>`<span style="background:${c};color:${i<2?'white':p.ink}">${c}</span>`).join('')}</div><p class="note">Weißer Buttontext: ${contrast}:1 Kontrast. Heller Akzent für Flächen und Details; dunkle Farbe für Text.</p>`;document.querySelector('main').append(a)}
</script></html>
